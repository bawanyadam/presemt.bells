<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Icon Generator - present.bells</title>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            padding: 40px;
            background: #0d1b2a;
            color: white;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .icon-item {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        canvas {
            background: white;
            border-radius: 10px;
            margin: 10px 0;
        }
        button {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }
        button:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <h1>present.bells Icon Generator</h1>
    <p>Right-click each icon and "Save image as..." to download</p>

    <div class="icon-grid" id="iconGrid"></div>

    <script>
        const sizes = [
            { size: 32, name: 'favicon-32x32.png' },
            { size: 180, name: 'apple-touch-icon.png' },
            { size: 192, name: 'android-chrome-192x192.png' },
            { size: 512, name: 'android-chrome-512x512.png' }
        ];

        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 100;

            ctx.scale(scale, scale);

            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, 0, 100);
            grad.addColorStop(0, '#000814');
            grad.addColorStop(1, '#001d3d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 100, 100);

            // Bunny - Large and Visible!
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(255,255,255,0.6)';
            ctx.fillStyle = 'white';

            // Left ear
            ctx.save();
            ctx.translate(35, 28);
            ctx.rotate(-0.21);
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Right ear
            ctx.save();
            ctx.translate(65, 28);
            ctx.rotate(0.21);
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Ear inner details
            ctx.fillStyle = 'rgba(255,200,220,0.3)';

            ctx.save();
            ctx.translate(35, 30);
            ctx.rotate(-0.21);
            ctx.beginPath();
            ctx.ellipse(0, 0, 5, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(65, 30);
            ctx.rotate(0.21);
            ctx.beginPath();
            ctx.ellipse(0, 0, 5, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Body/Head
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(50, 58, 32, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            // Eyes
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(40, 52, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(60, 52, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye highlights
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(41.5, 50.5, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(61.5, 50.5, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Nose
            ctx.fillStyle = 'rgba(255,150,150,0.4)';
            ctx.beginPath();
            ctx.arc(50, 62, 4, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(50, 64);
            ctx.quadraticCurveTo(45, 67, 42, 65);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(50, 64);
            ctx.quadraticCurveTo(55, 67, 58, 65);
            ctx.stroke();

            // Tiny star accents
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(12, 12, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.arc(88, 18, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Generate all sizes
        sizes.forEach(({ size, name }) => {
            const container = document.createElement('div');
            container.className = 'icon-item';

            const title = document.createElement('h3');
            title.textContent = name;

            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = Math.min(size, 200) + 'px';
            canvas.style.height = Math.min(size, 200) + 'px';

            drawIcon(canvas, size);

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = 'Download';
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = name;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            container.appendChild(title);
            container.appendChild(canvas);
            container.appendChild(downloadBtn);

            document.getElementById('iconGrid').appendChild(container);
        });
    </script>
</body>
</html>
